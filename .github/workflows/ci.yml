name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # DJOneHub is macOS-only: it links libusb through cgo and reads USB layout
    # via ioreg, so the checks have to run on a macOS runner.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libusb
        run: brew install libusb pkg-config

      # Unpinned on purpose, to match what `make lint` uses locally. A new
      # golangci-lint release can therefore surface new findings; pin it here if
      # that ever turns into a surprise red build.
      - name: Install golangci-lint
        run: brew install golangci-lint

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build
